name: Publish LoopHole Polygeist Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - POC_initial_demo/docker/Dockerfile
      - POC_initial_demo/docker/toolchain.lock
      - .github/workflows/publish-docker-image.yml

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize owner casing
        id: vars
        shell: bash
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner_lc }}/loophole-polygeist
          tags: |
            type=raw,value=llvm17
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: POC_initial_demo
          file: POC_initial_demo/docker/Dockerfile
          push: true
          build-args: |
            BUILD_THREADS=2
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
