name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/loophole

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Install MLIR verifier tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mlir-tools || \
          sudo apt-get install -y --no-install-recommends mlir-18-tools || \
          sudo apt-get install -y --no-install-recommends mlir-17-tools

      - name: Resolve verifier binary
        run: |
          if command -v mlir-opt >/dev/null 2>&1; then
            echo "LOOPHOLE_MLIR_VERIFY_CMD=mlir-opt" >> "$GITHUB_ENV"
          elif command -v mlir-opt-18 >/dev/null 2>&1; then
            echo "LOOPHOLE_MLIR_VERIFY_CMD=mlir-opt-18" >> "$GITHUB_ENV"
          elif command -v mlir-opt-17 >/dev/null 2>&1; then
            echo "LOOPHOLE_MLIR_VERIFY_CMD=mlir-opt-17" >> "$GITHUB_ENV"
          else
            echo "No MLIR verifier binary found on PATH" >&2
            exit 1
          fi

      - name: Run tests with artifact validation required
        env:
          LOOPHOLE_REQUIRE_MLIR_VERIFY: "1"
        run: pytest tests/ -q

      - name: Trusted lane batch validation smoke check
        env:
          LOOPHOLE_REQUIRE_MLIR_VERIFY: "1"
        run: |
          python -m loophole.cli batch tests/fixtures --profile trusted --include-glob matmul.mlir --max-files 1 --no-write-emitted

      - name: Trusted lane CI guard checks
        env:
          LOOPHOLE_REQUIRE_MLIR_VERIFY: "1"
        run: |
          pytest tests/integration/test_cli_batch_report.py::test_trusted_batch_requires_validation_even_without_flag -q
          pytest tests/integration/test_cli_batch_report.py::test_trusted_batch_fails_when_verifier_missing -q
          pytest tests/integration/test_cli_batch_report.py::test_trusted_batch_fails_on_invalid_artifact -q

      - name: B-16 parser/emitter reliability guard checks
        env:
          LOOPHOLE_REQUIRE_MLIR_VERIFY: "1"
        run: |
          pytest tests/unit/test_affine_extractor.py::TestDynamicMemrefNormalizationB15::test_static_zero_dimension_is_preserved -q
          pytest tests/unit/test_emitter.py::TestEmitterReliabilityBurnDownB16::test_emit_matmul_preserves_static_zero_dim -q
          pytest tests/unit/test_emitter.py::TestEmitterReliabilityBurnDownB16::test_conv_attr_inference_var_times_const_without_sympy -q
